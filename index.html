<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تبوح بايس سخنين | תפוח פייס סחנין</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:#f7faff;color:#18264b}header{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:15px 5%;box-shadow:0 4px 25px #263b7010;gap:15px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:inherit;text-decoration:none}button,.btn{border:0;border-radius:14px;padding:13px 22px;background:#6254df;color:white;font-weight:bold;cursor:pointer;display:inline-block}button:hover,.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}.hero{position:relative;overflow:hidden;min-height:570px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:65px 8%;background:radial-gradient(at 80% 20%,#c9f6ef,transparent 45%),linear-gradient(120deg,#eee9ff,#e4f5ff)}h1{font-size:clamp(38px,6vw,76px);line-height:1.15;margin:18px 0}h1 span{color:#6551d8}.hero p{font-size:21px;line-height:1.8;max-width:570px}.eyebrow{color:#6551d8;font-weight:bold;letter-spacing:1px}.atom{width:min(100%,430px);margin:auto;animation:float 5s ease-in-out infinite}.orbit{transform-origin:200px 200px;animation:spin 18s linear infinite}.bubble{position:absolute;border-radius:50%;background:#fff8;animation:float 7s infinite alternate;pointer-events:none}@keyframes float{50%{transform:translateY(-18px)}}@keyframes spin{to{transform:rotate(360deg)}}section{padding:65px 8%}h2{font-size:36px;margin:0 0 12px}.sub{color:#66728b;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:25px}.tile{background:white;border:1px solid #e6eaf5;border-radius:24px;padding:25px;box-shadow:0 10px 30px #344e8610;transition:.3s}.tile:hover{transform:translateY(-8px);box-shadow:0 16px 35px #6254df25}.symbol{font-size:40px;display:block;margin-bottom:16px}.tile h3{font-size:23px;margin:10px 0}.tile p{line-height:1.7;color:#65728a}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.filters input,.filters select{font:inherit;border:1px solid #d9dff0;border-radius:12px;padding:13px;background:white;color:#18264b}.filters input{flex:1;min-width:180px}.tag{font-size:12px;color:#6254df;background:#eeeaff;padding:6px 10px;border-radius:20px}.band{background:#19264d;color:white}.band .sub{color:#c9d4f0}footer{padding:30px 8%;background:#101a37;color:white}dialog{border:0;border-radius:24px;padding:30px;max-width:620px;width:90%;color:#18264b;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#18264b88}dialog p{line-height:1.8}.close{float:left}.reveal{opacity:0;transform:translateY(22px);transition:.65s}.reveal.show{opacity:1;transform:none}@media(max-width:700px){.hero{grid-template-columns:1fr;padding:40px 6%}.atom{max-width:250px}section{padding:40px 6%}nav{font-size:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.team-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.team-card{text-align:center;position:relative;overflow:hidden}.team-card:before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#6551d8,#00a99b)}.team-card.director{max-width:380px;margin:25px auto 0;background:linear-gradient(145deg,#fff,#eeeaff)}.avatar{width:90px;height:90px;border-radius:50%;margin:8px auto 20px;display:grid;place-items:center;background:linear-gradient(135deg,#eeeaff,#d9f7f1);color:#6551d8}.avatar svg{width:46px;height:46px}.team-card p{margin-bottom:0}</style></head><body><header><a class="brand" href="#home">⚛ <span data-t="brand"></span></a><nav><a href="#home" data-t="home"></a><a href="#about" data-t="about"></a><a href="#team" data-t="team"></a><a href="#experiments" data-t="experiments"></a><a href="#innovation" data-t="innovation"></a><a href="#news" data-t="news"></a></nav><button id="lang">עברית</button></header><main><div class="hero" id="home"><div><div class="eyebrow" data-t="slogan"></div><h1 data-t="headline"></h1><p data-t="intro"></p><a class="btn" href="#experiments" data-t="explore"></a></div><svg class="atom" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="150" fill="#fff" opacity=".4"/><g class="orbit" fill="none" stroke-width="5"><ellipse cx="200" cy="200" rx="175" ry="65" stroke="#6551d8"/><ellipse cx="200" cy="200" rx="175" ry="65" transform="rotate(60 200 200)" stroke="#00a99b"/><ellipse cx="200" cy="200" rx="175" ry="65" transform="rotate(120 200 200)" stroke="#399de0"/><circle cx="375" cy="200" r="13" fill="#ff9c45" stroke="none"/><circle cx="112" cy="48" r="11" fill="#6551d8" stroke="none"/></g><circle cx="200" cy="200" r="34" fill="#6551d8"/><circle cx="190" cy="190" r="10" fill="#fff" opacity=".5"/></svg></div><section id="about"><h2 data-t="about"></h2><p class="sub" data-t="aboutText"></p><div class="grid" id="fields"></div></section><section id="team"><h2 data-t="team"></h2><div id="director"></div><div class="grid team-grid" id="teamCards"></div></section><section id="experiments"><div class="eyebrow" data-t="library"></div><h2 data-t="experiments"></h2><p class="sub" data-t="expIntro"></p><div class="filters"><input id="search"><select id="category"></select></div><div class="grid" id="cards"></div></section><section class="band" id="innovation"><h2 data-t="innovation"></h2><p class="sub" data-t="innovationText"></p></section><section id="news"><h2 data-t="news"></h2><p class="sub" data-t="soon"></p></section></main><footer data-t="brand"></footer><dialog id="detail"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="detailBody"></div></dialog><script>
const words={ar:{team:'طاقم العمل المهني',brand:'تبوح بايس سخنين',home:'الرئيسية',about:'عن المركز',experiments:'التجارب العلمية',innovation:'الروبوتيكا والابتكار',news:'الأخبار والفعاليات',slogan:'علوم • تكنولوجيا • ابتكار',headline:'اكتشف العلم.<br><span>اصنع المستقبل.</span>',intro:'عالم من الاكتشاف والتجربة والتفكير العلمي، للطلاب والمعلمين.',explore:'استكشف التجارب العلمية ←',aboutText:'مساحة رقمية للتعلم والاستكشاف العلمي. ستضاف النبذة الرسمية للمركز لاحقًا.',library:'مكتبة العلوم',expIntro:'تجارب تعليمية نموذجية، اختر المجال أو ابحث عن تجربة.',innovationText:'مساحة لعرض مشاريع الروبوتيكا والبرمجة والهندسة والطباعة ثلاثية الأبعاد.',soon:'ستضاف أخبار المركز وصور الفعاليات بعد توفير المحتوى الرسمي.',search:'ابحث عن تجربة...',all:'جميع المجالات',open:'عرض التجربة',goal:'الهدف',tools:'الأدوات',steps:'الخطوات',safety:'السلامة: تنفيذ بإشراف المعلم.'},he:{team:'הצוות המקצועי',brand:'תפוח פייס סחנין',home:'דף הבית',about:'אודות המרכז',experiments:'ניסויים מדעיים',innovation:'רובוטיקה וחדשנות',news:'חדשות ופעילויות',slogan:'מדע • טכנולוגיה • חדשנות',headline:'מגלים את המדע.<br><span>יוצרים את העתיד.</span>',intro:'עולם של גילוי, ניסוי וחשיבה מדעית לתלמידים ולמורים.',explore:'גלו את הניסויים המדעיים ←',aboutText:'מרחב דיגיטלי ללמידה ולחקר. מידע רשמי על המרכז יתווסף בהמשך.',library:'ספריית המדע',expIntro:'ניסויים לימודיים לדוגמה. בחרו תחום או חפשו ניסוי.',innovationText:'מרחב להצגת פרויקטים ברובוטיקה, תכנות, הנדסה והדפסה בתלת ממד.',soon:'חדשות ותמונות יתווספו לאחר קבלת תוכן רשמי.',search:'חיפוש ניסוי...',all:'כל התחומים',open:'לצפייה בניסוי',goal:'מטרה',tools:'ציוד',steps:'שלבים',safety:'בטיחות: ביצוע בהשגחת המורה.'}};
const staff=[['نبيل سيد أحمد','נביל סיד אחמד','مدير مركز العلوم','מנהל מרכז המדעים'],['نيفين شلاعطة','ניבין שלעאטה','فنية مختبر حاسوب وعلوم','טכנאית מעבדת מחשבים ומדעים'],['سماح أبو يونس','סמאח אבו יונס','فنية مختبر علوم','טכנאית מעבדת מדעים'],['نجاح أبو يونس','נג׳אח אבו יונס','فنية مختبر حاسوب','טכנאית מעבדת מחשבים'],['مي خلايلة','מיי חלאילה','فنية مختبر علوم','טכנאית מעבדת מדעים'],['إيناس خلايلة','אינאס חלאילה','فنية مختبر علوم','טכנאית מעבדת מדעים']];function renderTeam(i){const card=(m,d=false)=>`<article class="tile team-card ${d?'director':''}"><div class="avatar" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="24" cy="15" r="8"/><path d="M8 42v-4a16 16 0 0 1 32 0v4"/></svg></div><h3>${m[i]}</h3><p>${m[i+2]}</p></article>`;$('director').innerHTML=card(staff[0],true);$('teamCards').innerHTML=staff.slice(1).map(m=>card(m)).join('')}const fields=[['🧪','الكيمياء','כימיה'],['⚡','الفيزياء','פיזיקה'],['🌱','البيولوجيا','ביולוגיה'],['🌍','علوم البيئة','מדעי הסביבה']];const ex=[{c:0,n:['الكثافة وطبقات السوائل','צפיפות ושכבות נוזלים'],g:['مقارنة كثافة السوائل','השוואת צפיפות נוזלים'],m:['كأس شفاف، ماء، زيت','כוס שקופה, מים, שמן'],s:['ضع الماء ثم أضف الزيت ببطء. راقب الطبقات وسجل ملاحظاتك.','מזגו מים והוסיפו שמן באיטיות. התבוננו בשכבות ותעדו.']},{c:1,n:['تحولات الطاقة','גלגולי אנרגיה'],g:['ملاحظة تحول الطاقة الكهربائية إلى ضوئية','המרת אנרגיה חשמלית לאור'],m:['بطارية منخفضة الجهد، مصباح مناسب، أسلاك','סוללה במתח נמוך, נורה מתאימה, חוטים'],s:['صل دائرة بسيطة بإشراف المعلم ولاحظ إضاءة المصباح.','חברו מעגל פשוט בהשגחת המורה וצפו בנורה.']},{c:2,n:['إنبات البذور','הנבטת זרעים'],g:['فحص أثر الماء على الإنبات','בדיקת השפעת מים על נביטה'],m:['بذور، قطن، وعاءان، ماء','זרעים, צמר גפן, שני כלים, מים'],s:['ضع بذورًا في وعاءين متماثلين. رطب القطن في أحدهما فقط وسجل التغيرات يوميًا.','הניחו זרעים בשני כלים זהים. הרטיבו רק אחד ותעדו שינויים מדי יום.']},{c:3,n:['ترشيح المياه','סינון מים'],g:['فهم فصل الجسيمات من الماء','הבנת הפרדת חלקיקים ממים'],m:['قمع، ورق ترشيح، ماء مع تراب','משפך, נייר סינון, מים עם אדמה'],s:['مرر الماء عبر ورق الترشيح وقارن قبل وبعد. لا تشرب الماء الناتج.','העבירו מים דרך נייר הסינון והשוו לפני ואחרי. אין לשתות את המים.']}];let lang='ar';const $=id=>document.getElementById(id);function render(){let i=lang==='ar'?0:1,w=words[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=w[e.dataset.t]);$('lang').textContent=i?'العربية':'עברית';$('search').placeholder=w.search;$('category').innerHTML='<option value="">'+w.all+'</option>'+fields.map((f,j)=>`<option value="${j}">${f[i+1]}</option>`).join('');$('fields').innerHTML=fields.map((f,j)=>`<a class="tile" href="#experiments" onclick="filterField(${j})"><span class="symbol">${f[0]}</span><h3>${f[i+1]}</h3></a>`).join('');renderTeam(i);cards()}function filterField(j){$('category').value=j;cards()}function cards(){let i=lang==='ar'?0:1,w=words[lang],q=$('search').value.toLowerCase(),c=$('category').value;$('cards').innerHTML=ex.map((e,j)=>({e,j})).filter(({e})=>(c===''||+c===e.c)&&e.n[i].toLowerCase().includes(q)).map(({e,j})=>`<article class="tile"><span class="symbol">${fields[e.c][0]}</span><span class="tag">${fields[e.c][i+1]}</span><h3>${e.n[i]}</h3><p>${e.g[i]}</p><button onclick="showExp(${j})">${w.open}</button></article>`).join('')}function showExp(j){let e=ex[j],i=lang==='ar'?0:1,w=words[lang];$('detailBody').innerHTML=`<h2>${e.n[i]}</h2><h3>${w.goal}</h3><p>${e.g[i]}</p><h3>${w.tools}</h3><p>${e.m[i]}</p><h3>${w.steps}</h3><p>${e.s[i]}</p><p>${w.safety}</p>`;$('detail').showModal()}$('lang').onclick=()=>{lang=lang==='ar'?'he':'ar';render()};$('search').oninput=cards;$('category').onchange=cards;render();const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');obs.unobserve(e.target)}}));document.querySelectorAll('section').forEach(e=>{e.classList.add('reveal');obs.observe(e)});
</script></body></html>

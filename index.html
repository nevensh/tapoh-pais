function renderNews(){const i=lang==='ar'?0:1;const j=activities.length-1;const title=['إنجاز عالمي استثنائي في بطولة الروبوتيكا الدولية IYRC 2026 – كوريا الجنوبية','הישג עולמי יוצא דופן בתחרות הרובוטיקה הבינלאומית IYRC 2026 – דרום קוריאה'][i];const paragraphs=i?['המשלחת הגיעה להישג עולמי יוצא דופן וזכתה ביותר מ־100 גביעים ובעשרות מדליות. חברי המשלחת הצטיינו וזכו במקום הראשון במשימות ובאתגרים רבים.','הישג מרשים המשקף את יכולות תלמידינו, יצירתיותם והצטיינותם בתחומי הרובוטיקה, התכנות והטכנולוגיה, ואת פירות עבודת הצוות, ההתמדה והשאפתנות.','תודה והערכה לאגודת אל־בירוני ולצוותה המצטיין, ולמרכז המדע והטכנולוגיה – תפוח פייס סחנין.','גאים בתלמידינו ובהישגיהם, ומאחלים להם הצלחות נוספות בזירה העולמית!']:['حقّقت البعثة إنجازًا عالميًا استثنائيًا، بحصد أكثر من 100 كأس وعشرات الميداليات، وتألق أفراد البعثة بتحقيق المرتبة الأولى في العديد من المهام والتحديات.','إنجاز مشرّف يعكس قدرات طلابنا وإبداعهم وتميّزهم في مجالات الروبوتيكا والبرمجة والتكنولوجيا، ويجسّد ثمرة العمل الجماعي والمثابرة والطموح.','كل الشكر والتقدير لجمعية البيروني وطاقمها المتميّز، ولمركز العلوم والتكنولوجيا – تبوح بايس سخنين.','فخورون بطلابنا وإنجازاتهم، وإلى المزيد من التألق والنجاحات العالمية!'];$('homeNewsCard').innerHTML=`<article class="home-news-card"><a href="#news"><img src="${newsImages[0]}" alt="${title}" loading="lazy"></a><div><h3>${title}</h3><p>${paragraphs[0]}</p><a class="btn" href="#news">${i?'לכתבה המלאה':'اقرأ المزيد'} ←</a></div></article>`;$('newsCard').innerHTML=`<article class="news-article"><h3>${title}</h3><img class="news-cover" src="${newsImages[0]}" alt="${title}"><div class="news-stats"><div>🏆<strong id="cupCount">100+</strong>${i?'גביעים':'كأس'}</div><div>🏅<strong>${i?'עשרות':'عشرات'}</strong>${i?'מדליות':'الميداليات'}</div><div>🥇<strong>${i?'ראשון':'الأولى'}</strong>${i?'במשימות רבות':'في عدة مهام'}</div></div>${paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="media-grid">${newsImages.map((src,k)=>`<button onclick="openPhoto(${j},${k})" aria-label="${title} ${k+1}"><img loading="lazy" src="${src}" alt="${title} ${k+1}"></button>`).join('')}</div></article>`;if(location.hash==='#news')animateCups()}
let cupFrame=0;function animateCups(){cancelAnimationFrame(cupFrame);const el=$('cupCount');if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const start=performance.now();function tick(now){const n=Math.min(100,Math.round((now-start)/12));el.textContent=n+'+';if(n<100)cupFrame=requestAnimationFrame(tick)}cupFrame=requestAnimationFrame(tick)}

function route(){let hash=location.hash.slice(1),special=['peak-day','karev','news'].includes(hash);$('homeContent').hidden=special;for(let id of ['peak-day','karev','news']){$(id).hidden=hash!==id;if(hash!==id)$(id).querySelectorAll('video').forEach(v=>v.pause())}if(hash==='news')animateCups();if(special)window.scrollTo(0,0);else if(hash)requestAnimationFrame(()=>$(hash)?.scrollIntoView());}window.addEventListener('hashchange',route);
$('lang').onclick=()=>{lang=lang==='ar'?'he':'ar';render()};$('search').oninput=cards;$('category').onchange=cards;render();route();const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');obs.unobserve(e.target)}}));document.querySelectorAll('#homeContent section').forEach(e=>{e.classList.add('reveal');obs.observe(e)});
</script></body></html>
